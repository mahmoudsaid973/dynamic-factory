[project]
name = "dynamic-factory"
version = "0.1.0"
description = "Dynamic Factory monorepo"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests/skills"]
pythonpath = ["."]
addopts = "-v"
