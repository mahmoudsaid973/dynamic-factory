name: Stale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been marked stale due to 30 days of inactivity. It will be closed in 7 days unless updated."
          stale-issue-label: stale
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-pr-message: "This PR has been marked stale due to 14 days of inactivity. It will be closed in 7 days unless updated."
          stale-pr-label: stale
          days-before-pr-stale: 14
          days-before-pr-close: 7
          remove-stale-when-updated: true
          exempt-all-milestones: true
