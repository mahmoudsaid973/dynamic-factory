name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git log --pretty=format:"- %s (%h)" "$(git describe --tags --abbrev=0 HEAD~1)"..HEAD > CHANGELOG_FRAGMENT.md || true
          if [ ! -s CHANGELOG_FRAGMENT.md ]; then
            echo "- Release $VERSION" > CHANGELOG_FRAGMENT.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.changelog.outputs.version }}
          body_path: CHANGELOG_FRAGMENT.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.version, '-') }}

  pypi:
    name: Publish to PyPI (placeholder)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/dynamic-factory-api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-cache: true
      - name: Build Python package
        run: uv build
        working-directory: services/api
      - name: Publish placeholder
        run: |
          echo "PyPI publish is a placeholder. Configure PYPI_API_PASSWORD/PYPI_TOKEN to enable real publishing."
          ls -la dist/
        working-directory: services/api
