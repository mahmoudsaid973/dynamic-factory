name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate PR diff size
        id: size
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD=${{ github.event.pull_request.head.sha || github.sha }}
          LINES=$(git diff --numstat "$BASE" "$HEAD" | awk '{add+=$1; del+=$2} END {print add+del}')
          echo "changed_lines=${LINES:-0}" >> "$GITHUB_OUTPUT"
          echo "Changed lines: ${LINES:-0}"
      - name: Warn on large PR
        if: ${{ steps.size.outputs.changed_lines > 1000 }}
        run: |
          echo "::warning::PR changes ${CHANGED_LINES} lines, which exceeds the 1000-line recommended limit."
          echo "Consider splitting into smaller PRs for easier review."
        env:
          CHANGED_LINES: ${{ steps.size.outputs.changed_lines }}

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check conventional commits
        uses: webiny/action-conventional-commits@v1.3.0
        with:
          allowed-commit-types: "feat,fix,docs,style,refactor,test,ci,chore,perf"

  bundle-size:
    name: Bundle Size Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and report bundle size
        run: |
          npm run build -w apps/web
          du -sh apps/web/.next
          du -sh apps/web/.next/static 2>/dev/null || true
          find apps/web/.next -type f \( -name "*.js" -o -name "*.css" \) -exec wc -c {} + | sort -n | tail -20 || true
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: apps/web/.next
          if-no-files-found: ignore
